# Solar-disciplined chronyd.  Runs with -x (never touches the system clock)
# and gets its time of day only from `chronyc settime` via solar-noon.

# Serve on a single IPv6 address only; chronyd is also started with -6.
bindaddress 2001:db8::123   # your server's IPv6 address
port 123
allow 2001:db8::/64
ratelimit interval 1 burst 16

# Unix command socket only; solar-noon talks to it as a member of _chrony.
cmdport 0
bindcmdaddress /run/chrony-solar/chronyd.sock
pidfile /run/chrony-solar/chronyd.pid

# Accept `settime`, and advertise ourselves as the stratum-1 reference.
# Without `local`, manual mode alone serves leap=unsynchronised.
manual
local stratum 1

driftfile /var/lib/chrony-solar/drift
logdir /var/log/chrony-solar
log tracking

# Deliberately absent: server/pool/refclock, makestep, rtcsync,
# hwtimestamp, leapseclist.
