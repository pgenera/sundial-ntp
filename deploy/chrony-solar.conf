# Solar-disciplined chronyd.  Runs with -x (never touches the system clock)
# and gets its time of day only from the sun, via `solar-noon feed` posting
# samples to an NTP shared-memory refclock, just as gpsd does for GPS.

# Serve on a single IPv6 address only; chronyd is also started with -6.
bindaddress 2001:db8::123   # your server's IPv6 address
port 123
allow 2001:db8::/64
ratelimit interval 1 burst 16

# Read-only monitoring for any local user: chronyc -h ::1 -p 11323 tracking
# Commands that change anything are only accepted on the Unix socket
# (root and the _chrony group).
cmdport 11323
bindcmdaddress ::1
bindcmdaddress /run/chrony-solar/chronyd.sock
pidfile /run/chrony-solar/chronyd.pid

# The sun.  solar-noon feed (user chrony-solar, group _chrony) writes to the
# SHM segment; clients see stratum 1 with reference ID SUN.  The refclock
# line lives in this include file because its `precision` is the sun's
# current error bound (tens of seconds), which the feed rewrites; a path
# unit restarts chronyd to read it.  `solar-noon refclock` writes it first.
include /var/lib/solar-noon/refclock.conf

# That error is honest, so the root distance is tens of seconds: far over
# chronyd's 3 s default for a usable source, and over the 1 s at which the
# local reference takes over.  Raise both, or chronyd serves stratum 10.
# Clients will see the sun's time but, rightly, won't sync to it.
maxdistance 1000

# With no fix from the sun for a long time, fall back to our own clock at a
# stratum nobody will prefer.
local stratum 10 distance 1000

driftfile /var/lib/chrony-solar/drift

# Deliberately absent: server/pool, makestep (no clock to step under -x),
# rtcsync, hwtimestamp, leapseclist, logdir/log (the journal has what matters).
